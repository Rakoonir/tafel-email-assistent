name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create package settings
        shell: pwsh
        run: Copy-Item desktop/appsettings.example.json desktop/appsettings.json

      - name: Publish application
        run: dotnet publish desktop/TafelEmailAssistent.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Create Velopack packages
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          vpk pack --packId TafelEmailAssistent --packVersion $version --packDir publish --mainExe TafelEmailAssistent.exe --packTitle "Tafel E-Mail-Assistent" --packAuthors "Kjano Eglins" --runtime win-x64 --msi --instLocation PerUser --outputDir Releases

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Releases/*